services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      # Every frontend origin that may call /chat. A missing origin shows up in
      # the browser as "Failed to fetch", never as a backend error.
      - key: ALLOWED_ORIGINS
        value: https://frontend-anima24.vercel.app,https://lyftr-ai-frontend-tawny.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: "You are Lyftr AI, a thoughtful and concise assistant. Use the conversation history to answer follow-up questions. If you are uncertain, say so clearly."
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_OUTPUT_TOKENS
        value: "4096"
      - key: PORT
        value: "8000"
    disk:
      name: lyftr-sqlite
      mountPath: /data
      sizeGB: 1
